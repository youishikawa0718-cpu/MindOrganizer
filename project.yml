name: MindOrganizer
options:
  bundleIdPrefix: com.yukiishikawa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    version: 11.12.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    version: 8.0.0

targets:
  MindOrganizer:
    type: application
    platform: iOS
    sources:
      - MindOrganizer
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: MindOrganizerWidgetExtension
    info:
      path: MindOrganizer/Info.plist
      properties:
        GIDClientID: 382107919847-pv5seos3pkie4770tqpt55s94b3re0e1.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.382107919847-pv5seos3pkie4770tqpt55s94b3re0e1
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yukiishikawa.MindOrganizer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "S22J52XQ9P"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
    entitlements:
      path: MindOrganizer/MindOrganizer.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.yukiishikawa.MindOrganizer

  MindOrganizerWidgetExtension:
    type: app-extension
    platform: iOS
    info:
      path: MindOrganizerWidget/Info.plist
      properties:
        CFBundleDisplayName: MindOrganizer Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - MindOrganizerWidget
      - path: MindOrganizer/Models
        excludes:
          - "FirestoreDTO/**"
        createIntermediateGroups: true
      - path: MindOrganizer/App/SharedModelContainer.swift
        createIntermediateGroups: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MindOrganizer Widget
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.yukiishikawa.MindOrganizer.Widget
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "S22J52XQ9P"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: MindOrganizerWidget/MindOrganizerWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yukiishikawa.MindOrganizer
